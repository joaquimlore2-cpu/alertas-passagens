name: Sondar fontes (temporário)
on: workflow_dispatch
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install feedparser==6.0.11
      - shell: python
        run: |
          import feedparser
          urls = [
            "https://www.secretflying.com/feed/",
            "https://www.secretflying.com/posts/category/error-fare/feed/",
            "https://www.secretflying.com/posts/category/brazil/feed/",
            "https://passagensimperdiveis.com.br/feed/",
            "https://www.passagensimperdiveis.com.br/feed/",
            "https://mapadasmilhas.com.br/feed/",
            "https://www.mestredasmilhas.com/feed/",
            "https://aeroin.net/feed/",
            "https://www.voeazul.com.br/feed",
            "https://viajeinteligente.com.br/feed/",
            "https://www.promocoesdepassagens.com.br/feed/",
            "https://passagenspromo.com.br/feed/",
            "https://www.melhoresdestinos.com.br/feed",
          ]
          for u in urls:
              f = feedparser.parse(u, agent="Mozilla/5.0 (alertas-passagens)")
              print(f"\n### {u} -> status={f.get('status')} itens={len(f.entries)} bozo={bool(f.bozo)}")
              for e in f.entries[:12]:
                  print("   -", e.get("published", "")[:16], "|", e.get("title", "")[:140])
