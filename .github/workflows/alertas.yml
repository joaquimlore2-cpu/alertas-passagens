name: Alertas de passagens

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write             # para salvar o histórico (seen.json)

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser==6.0.11 requests==2.32.3

      - name: Buscar promoções e enviar ao Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas.py

      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "alertas-bot"
          git config user.email "alertas-bot@users.noreply.github.com"
          [ -f seen.json ] || exit 0
          git add seen.json
          git diff --cached --quiet || (git commit -m "Atualiza histórico de alertas" && git pull --rebase origin main && git push)
